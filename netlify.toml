# OS Shell — Netlify (monorepo root as base directory)
[build]
  command = "npm ci && npm run build -w @osshell/contract && npm run build -w @osshell/runtime && npm run build -w @osshell/sdk && npm run build -w @osshell/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
