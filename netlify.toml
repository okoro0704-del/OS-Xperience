# Netlify site for Shell Demo Notes (compatible third-party demo app).
# Base directory must stay the monorepo root so workspaces resolve.
[build]
  command = "npm ci && npm run build -w @osshell/contract && npm run build -w @osshell/sdk && npm run build -w @osshell/demo-notes"
  publish = "apps/demo-notes/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
