# OS Experience — consumer web (Netlify)
# Separate from OS Shell (apps/web) and Xperience developer console (apps/xperience-console).
[build]
  command = "npm ci && npm run build -w @digiconomy/xperience-contract && npm run build -w @digiconomy/xperience-sdk && npm run build -w @digiconomy/os-experience"
  publish = "apps/os-experience/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
